# --- FIXED: Added SWAP allocation to stop the RC 137 Out-of-Memory Crash ---
- name: Create 1GB Swap file to prevent Out of Memory crash
  ansible.builtin.shell: |
    if [ ! -f /swapfile ]; then
      dd if=/dev/zero of=/swapfile bs=1M count=1024
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
    fi
  args:
    creates: /swapfile

- name: clean cache memory
  ansible.builtin.command:
    cmd: dnf clean all

- name: install epel-release
  ansible.builtin.yum:
    name: epel-release
    state: present

- name: install redis repo
  ansible.builtin.yum:
    name: "https://rpms.remirepo.net/enterprise/remi-release-8.rpm"
    state: installed
    disable_gpg_check: true

- name: Enable redis
  ansible.builtin.command: module enable redis:remi-7.2 -y

- name: Install redis repo
  ansible.builtin.yum:
    name: "redis"
    state: present

- name: allow remote connections to redis
  ansible.builtin.replace:
    path: /etc/redis.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: start and enable redis
  ansible.builtin.service:
    name: redis
    state: started
    enabled: yes
