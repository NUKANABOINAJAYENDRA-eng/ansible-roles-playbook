- name: Update all system packages
  ansible.builtin.yum:
    name: "*"
    state: latest
  become: yes

- name: Install redis repo
  ansible.builtin.yum:
    name: "redis"
    state: present
  become: yes

- name: allow remote connections to redis
  ansible.builtin.replace:
    path: /etc/redis/redis.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'
  become: yes

- name: start and enable redis
  ansible.builtin.service:
    name: redis
    state: started
    enabled: yes
  become: yes
